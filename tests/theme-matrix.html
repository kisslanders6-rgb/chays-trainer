<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matrice des thèmes</title>
<!-- Page de contrôle visuel (servie en HTTP : npm start, puis /tests/theme-matrix.html) : chaque échiquier en clair
     et en sombre, avec les éléments qui en tirent leurs couleurs (accent, repères, cerclage, cases). Une vignette =
     une iframe, car les thèmes se posent sur <html> (data-board, data-theme). Les contrastes sont vérifiés par
     tests/theme.test.js ; cette page sert à l'œil. -->
<style>
  body { margin: 0; padding: 20px; font: 14px system-ui, sans-serif; background: #e9e6df; color: #222; }
  h1 { font-size: 20px; margin: 0 0 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  iframe { width: 100%; height: 250px; border: 0; border-radius: 12px; box-shadow: 0 2px 10px rgba(0, 0, 0, .15); }
</style>
</head>
<body>
<h1>Échiquiers × clair / sombre</h1>
<div class="grid" id="grid"></div>
<script>
  const BOARDS = ['classic', 'leather', 'wood', 'ice', 'night', 'violet', 'walnut', 'stone', 'hache', 'maple', 'marble', 'tournament', 'cherry'];
  const sample = (board, mode) => `<!doctype html><html data-board="${board}" data-theme="${mode}"><head><meta charset="utf-8">
    <link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../css/home.css"><link rel="stylesheet" href="../css/screens.css">
    <style>body{margin:0;padding:14px;background:var(--bg);color:var(--text);font:13px system-ui,sans-serif;display:flex;gap:14px}
      #board{width:120px;height:120px;flex:none}.sq{aspect-ratio:1}.col{display:flex;flex-direction:column;gap:8px;min-width:0}
      .card{padding:10px;border-radius:12px;background:var(--surface);border:1px solid var(--border)}</style></head>
    <body><div id="board">${Array.from({ length: 64 }, (_, i) => `<div class="sq ${(Math.floor(i / 8) + i) % 2 ? 'dark' : 'light'}${i === 36 || i === 45 ? ' hl-to' : ''}"></div>`).join('')}</div>
    <div class="col"><b>${board} · ${mode === 'dark' ? 'sombre' : 'clair'}</b>
      <span class="trs-eyebrow">Repère d'accent</span>
      <button class="btn btn-primary">Bouton principal</button>
      <div class="card">Texte sur carte <a href="#" style="color:var(--accent)">lien</a></div>
      <span class="hp-kind new">Traitée depuis</span></div></body></html>`;
  const grid = document.getElementById('grid');
  BOARDS.forEach(b => ['light', 'dark'].forEach(m => {
    const f = document.createElement('iframe');
    f.title = `${b} ${m}`;
    f.srcdoc = sample(b, m);
    grid.appendChild(f);
  }));
</script>
</body>
</html>
